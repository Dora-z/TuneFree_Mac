[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tunefree-backend"
version = "3.0.0"
description = "TuneFree macOS 后端：解密 QQ音乐 mflac/mgg 并转 MP3，无需 QQ音乐客户端"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4"]

[project.scripts]
tunefree = "tunefree_backend.cli:main"

[tool.setuptools]
packages = ["tunefree_backend"]
